  body: |
    <p>The site you're looking at right now. A single-page Jekyll portfolio with sliding panels for About Me, Projects and a full Detailed CV, all themed and colour-matched to my actual CV rather than a generic template look.</p>

    <h4 class="cvstyle-subhead">What it's built on</h4>
    <p>Rather than starting from a blank page, I built this on top of two open-source Jekyll templates and reworked both substantially:</p>
    <ul>
      <li>The overall one-page shell (the sliding panel system, video background and layout grid) started from <strong>jekyll-uno</strong> by Josh Gerdes, as extended into <strong>jekyll-uno-timeline</strong> by Thomas Z&uuml;hlke, both MIT-licensed. Almost none of the original styling remains; the panel system, project carousel, colour theming and CV integration are my own additions on top of that base.</li>
      <li>The Detailed CV page is built on the <strong>Orbit</strong> resume/CV template by Xiaoying Riley (<a href="http://themes.3rdwavemedia.com" target="_blank" rel="nofollow">themes.3rdwavemedia.com</a>, Creative&nbsp;Commons&nbsp;Attribution&nbsp;3.0), restructured into the sidebar-plus-main layout you see and recoloured to match my actual paper CV, then embedded into the main site as its own popup panel.</li>
      <li>Icons throughout are <strong>Font&nbsp;Awesome&nbsp;Free</strong>. The site is built with Jekyll and hosted on GitHub&nbsp;Pages.</li>
    </ul>

    <h4 class="cvstyle-subhead">What I actually built</h4>
    <ul>
      <li>A shared sliding-panel system (About&nbsp;Me, Projects grid, and every individual project) with consistent open/close animation, keyboard (Escape) handling, and swipe support on mobile.</li>
      <li>The CV page: a from-scratch sidebar-plus-main layout matched to my real CV's colours, with per-project accent colours picked directly from each project's artwork rather than a fixed palette.</li>
      <li>The Detailed CV popup embeds the standalone CV page in an iframe so it stays a real, linkable page on its own while still opening in-place like every other panel.</li>
      <li>All the copy, project write-ups and colour decisions on the site are mine, iterated over several rounds to fix layout bugs, improve contrast, and keep the design consistent as content was added.</li>
    </ul>
