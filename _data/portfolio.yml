      icon: fas fa-gamepad
      title: Explore the game

  technologies:
    - "Unity 6 / URP"
    - "C#"
    - "ShaderLab / HLSL"
    - "Procedural Mesh Generation"
    - "NavMesh &amp; Enemy AI"
    - "Python / Pillow"
    - "Custom Rendering &amp; Ray-Traced AO"

  body: |
    <p><strong>Break the armour. Take the core. Choose the ship's fate.</strong> CoreBuster is a science-fiction first-person shooter developed in Unity 6 for COMP307 Computer Graphics. The player awakens aboard a malfunctioning spaceship overrun by hostile robots, fights through interconnected industrial chambers, and ultimately decides between escaping the ship or confronting its unstable reactor core.</p>

    <h4 class="cvstyle-subhead">The signature mechanic: Core Bust</h4>

    <p>At the centre of the combat system is <strong>Core Bust</strong>, a first-person execution mechanic. Armoured enemies contain unstable energy cores. Once their armour has been destroyed, the player can approach and execute them, physically extracting the exposed core through a synchronised animation. A successful execution restores health, but leaves behind a toxic gas cloud that creates a new environmental hazard.</p>

    <p>The mechanic is implemented through coordinated gameplay state machines involving <code>ArmouredEnemy</code>, <code>CoreExecutionTarget</code>, <code>CoreExecutioner</code> and <code>UnstableCore</code>. Armour destruction extracts geometry from the animated mesh and converts it into physical debris rather than simply hiding the armour.</p>

    <h4 class="cvstyle-subhead">Weapons and combat</h4>

    <ul>
      <li><strong>The Blaster:</strong> the player's primary firearm, used for conventional combat and breaking enemy armour.</li>
      <li><strong>The Disassembler:</strong> charged through successful executions, this sidearm electrocutes and temporarily immobilises enemies while exposing their cores for further executions.</li>
      <li><strong>XR-7 Armour Buster:</strong> an unlockable rocket launcher whose explosions strip armour from nearby enemies, preserving the game's execution-focused combat system.</li>
      <li><strong>Movement:</strong> sprinting, crouching, sliding, jumping, wall-running and dodging provide mobility during combat encounters.</li>
    </ul>

    <h4 class="cvstyle-subhead">Enemy AI</h4>

    <p>The game features <strong>four main enemy classes across nine variants</strong>, including armoured Cyber Soldiers and Elites, standard ground robots, and airborne HoverBots. Enemies use NavMesh navigation, room-aware pathfinding, line-of-sight detection, telegraphed attacks and procedural attack animation.</p>

    <p>Enemy behaviour reacts to armour damage, electrical status effects, the player's position and the ship's security doors. Reinforcements arrive through warp-in effects during lockdown encounters.</p>

    <h4 class="cvstyle-subhead">World and progression</h4>

    <p>The spaceship is designed as a continuous level with five connected zones, including a tutorial wing, workshop, reactor chamber, turbine hall and final Boss Hall. Security doors and keycards govern progression between areas, while terminals initiate lockdowns and waves of enemies.</p>

    <p>The game offers <strong>two endings</strong>. The player can survive a timed escape sequence or enter the final chamber and dismantle the giant reactor core through a multi-stage encounter involving three consoles and destructible armour layers.</p>

    <h4 class="cvstyle-subhead">Computer graphics engineering</h4>

    <ul>
      <li><strong>18 custom shaders:</strong> hand-written ShaderLab/HLSL implementations for energy fields, procedural armour damage, toxic gas, electrical effects, reactor beams and animated materials.</li>
      <li><strong>Procedural space environment:</strong> a GPU-generated nebula skybox featuring a black hole, gravitational lensing and an animated accretion disk.</li>
      <li><strong>First-principles asset generation:</strong> industrial machinery, tanks, reactors, turbines, pipes, weapons, environmental signage, textures and audio generated using Unity editor tools and Python scripts.</li>
      <li><strong>Ray-traced ambient occlusion:</strong> a custom rendering implementation with temporal accumulation and depth-aware filtering.</li>
      <li><strong>Visual effects:</strong> animated energy fields, electrical arcs, armour cracks, volumetric-looking gas effects, reactor instability and procedural particles.</li>
    </ul>

    <h4 class="cvstyle-subhead">Architecture and optimisation</h4>

    <p>Gameplay systems are organised into separate assemblies for shared infrastructure, gameplay, artificial intelligence, user interfaces and rendering.</p>

    <p>A custom <code>ZoneStreamer</code> system reduces rendering overhead by suppressing renderers in rooms that are not currently visible, while preserving physics and AI simulation. The project also includes configurable graphics quality profiles and rendering optimisations for constrained hardware.</p>

    <h4 class="cvstyle-subhead">Development context</h4>

    <p>Developed by <strong>Cosmic Studios</strong> as a five-person COMP307 group project at the University of KwaZulu-Natal. CoreBuster combines real-time computer graphics, interactive gameplay, procedural content creation, game AI and software engineering in a single playable project.</p>
- slug: confident-agent

  title: Confident Agent

  subtitle: Static Verification of REST API Hallucinations in LLM-Generated Code

  meta: COMP301 Group Project &middot; The Skeptics &middot; Team of 5 &middot; Group Leader

  accent: "#3D95E8"

  links:

    - href: "https://github.com/PilotDevNull/Confident-Agent-COMP301-Project"

      icon: fab fa-github

      title: View on GitHub

    - href: "https://github.com/PilotDevNull/Confident-Agent-COMP301-Project/blob/main/COMP301%20Project%20Final%20Submission/Final%20Report%20and%20Documentation/Final%20Report/COMP301%20The%20Skeptics%20Final%20Report.pdf"

      icon: fas fa-file-pdf

      title: Read the final report

  technologies:

    - "Python"

    - "TypeScript &amp; Node.js"

    - "LM Studio Plugin (Qwen3.5-9B)"

    - "OpenAPI Specifications"

    - "Pyright"

    - "pandas / SciPy / Matplotlib"

  body: |

    <p>My biggest project to date. Language models write plausible code that calls web APIs which do not exist, at versions that have been retired, with parameters the provider never documented. I led a team of five to test whether an agent can stop those REST API hallucinations from <em>reaching the user</em>, guided by one idea: a Confident Agent is not one that is always correct, but one that knows when it should not be trusted.</p>

    <h4 class="cvstyle-subhead">My contribution</h4>

    <p>I led the group and shaped the project end to end:</p>

    <ul>

      <li><strong>Overall architecture and design:</strong> the shape of the whole system, from how the model, the verification tool and the release decision fit together to how the experiment is structured around them.</li>

      <li><strong>Attachment point:</strong> I chose where the verifier plugs in. It runs as an in-loop tool the model calls through function calling, so the thing we measured is the package a developer would actually run, rather than a post-hoc script or a pipeline of more models that could hallucinate themselves.</li>

      <li><strong>Benchmark and evaluator design:</strong> the 1,000-task benchmark with its executable answer key, and an independent sandboxed evaluator that shares no code with the agent, so the agent's blind spots could not become the experiment's.</li>

      <li><strong>Running the tests and benchmark runs:</strong> the verifier and benchmark checks, plus the paired runs of the baseline and the agent.</li>

      <li><strong>Art style:</strong> the visual identity of the project, from the navy, yellow and blue palette to the banners, slides and README.</li>

    </ul>

    <h4 class="cvstyle-subhead">How it works</h4>

    <p>A local model (Qwen3.5-9B) is paired with a deterministic validation tool that parses the generated Python without running it and checks every API claim across six layers (imports, identifiers, access point, input contract, output contract and security context) against frozen, hashed OpenAPI specifications. The evidence is summarised in an Evidence-Weighted Confidence Score, and a decision policy then delivers, flags, corrects once, or withholds the code. Hard verification constraints, not the score, decide whether anything is released.</p>

    <h4 class="cvstyle-subhead">The experiment</h4>

    <ul>

      <li>A benchmark of 1,000 Python tasks over six public REST APIs, generated from pinned specifications. Of these, 990 were scored.</li>

      <li>A paired comparison of the unmodified model against the agent at three quantizations (2,970 task pairs).</li>

      <li>A pre-registered analysis plan, exact McNemar tests, cluster-bootstrap intervals, manual audits of the answer key and evaluator, and a cost analysis in time, tokens, energy and Rand.</li>

    </ul>

    <h4 class="cvstyle-subhead">Results</h4>

    <ul>

      <li>Hallucinated code reaching the user fell from <strong>50.8&ndash;55.2%</strong> to <strong>1.6&ndash;2.3%</strong>, while correct code rose from 24.9&ndash;36.9% to 50.4&ndash;51.5%.</li>

      <li>83% of baseline hallucinations (1,303 of 1,562) were stale or extrapolated API versions: the model reproduces the versions that dominate its training data and invents version numbers it has never seen. Nothing in its weights records that an API has moved, so the fix has to be external evidence.</li>

      <li>The protection has costs: the agent abstains on 38&ndash;40% of tasks and takes about six times the time and energy of the baseline. Verification establishes conformance to the API contract, not that the code does what the user asked.</li>

    </ul>
