projects:
  title: Projects
  intro: For more projects and details, visit my GitHub.
  assignments:
  - title: "Nexus Logistics: Inventory Management System"
    link: "https://github.com/PilotDevNull"
    tech: "C++ &middot; CLI + Qt6 GUI (bonus) &middot; COMP315 Group Project &middot; Team of 7"
    details: |
      Multi-threaded inventory and order-management system for a simulated 5-warehouse logistics network, with an object-oriented product hierarchy and CSV-backed persistence.
        - Designed a polymorphic OOP hierarchy (Standard, Discounted, Taxable products) with multi-threaded order processing (Producer/Consumer relationship) and per-warehouse analytics via a custom AnalyticsManager
        - Built a bonus Qt6 GUI (dashboard, inventory, analytics, orders) on top of the CLI backend via an adapter layer

  - title: Starlight Carnival Management System
    link: "https://github.com/PilotDevNull"
    tech: "Java, Swing, MySQL/JDBC &middot; COMP306 Group Project"
    details: |
      Full-stack desktop database application for managing a carnival's attractions, staff, and access passes.
        - Modelled 3 disjoint subtype hierarchies with role-based views, stored procedures, and triggers; built a Java Swing CRUD/reporting UI over MySQL via JDBC
        - Implemented role-based login (Admin, Sales, Maintenance, Guest) with distinct MySQL accounts

  - title: "Music Square: Mood-Based Music Player + PixelPlayer Android App Integration"
    link: "https://github.com/PilotDevNull"
    tech: "Python (Flask, librosa), JavaScript/HTML/CSS &middot; Personal Project &middot; Solo"
    details: |
      Local player that analyses a FLAC library's audio directly (no tags or cloud lookups) and plots every track on a 2D mood square built from listening to the actual sound.
        - Extracted tempo, loudness, onset density, brightness, and tonality with librosa, combining library-wide z-scores into weighted arousal/valence mood axes
        - Built a Flask backend for parallelized analysis/streaming and a vanilla JS/Canvas frontend with zoom/pan, mood-based playlist building, and OS media-key integration
        - Currently working on porting the analysis algorithm to Android via the open-source PixelPlayer Music Player

  - title: "NLP Sentiment Classification: Naive Bayes vs LSTM vs BERT"
    link: "https://github.com/PilotDevNull"
    tech: "Python, scikit-learn, PyTorch/Transformers &middot; COMP316 Group Project &middot; Team of 3"
    details: |
      Built and curated a custom dataset of 60,000 Steam game reviews by collecting data through the Steam Web API and processing it to make it suitable for comparative sentiment analysis.
        - Designed and implemented the BERT fine-tuning pipeline, achieving 90.3% accuracy and a 90.3% F1-score, outperforming the Naive Bayes and Bi-LSTM baselines (&approx;84%) in sentiment classification

