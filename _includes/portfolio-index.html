    <section class="portfolio-index-section" id="portfolio-index-section">
        <div class="portfolio-index-container">
            <div class="portfolio-index-header">
                <h1>Projects</h1>
                <button class="close-portfolio" id="close-portfolio-index" aria-label="Close projects">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="portfolio-index-content">
                <div class="category-grid">
                    {% for project in site.data.portfolio %}
                    <article class="category-tile" data-target="{{ project.slug }}-section">
                        <div class="tile-image">
                            <img src="{{ site.baseurl }}/images/projects/{{ project.slug }}.jpg" alt="{{ project.title }}">
                        </div>
                        <a href="#" class="tile-title-link" data-target="{{ project.slug }}-section" aria-label="Open {{ project.title }} project">
                            <span class="tile-title">{{ project.title }}</span>
                            <i class="fas fa-arrow-up-right-from-square"></i>
                        </a>
                    </article>
                    {% endfor %}
                </div>
            </div>
        </div>
    </section>
